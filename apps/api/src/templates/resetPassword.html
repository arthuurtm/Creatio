<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #f4f6f8; padding: 40px 0;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 500px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e5e7eb;">
          <tr>
            <td style="padding: 40px 32px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <img src="cid:unique@cid" alt="Logo Creatio" style="width: 120px; max-width: 120px; height: auto; display: block;" />
                  </td>
                </tr>
              </table>
              <h1 style="margin: 0 0 16px 0; color: #111827; font-size: 22px; font-weight: 700; line-height: 1.3; text-align: center;">
                Redefinição de senha
              </h1>
              <p style="margin: 0 0 16px 0; color: #4b5563; font-size: 15px; line-height: 1.6; text-align: left;">
                Olá, <strong>{{username}}</strong>! Recebemos uma solicitação para redefinir a senha da sua conta.
              </p>
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 24px 0;">
                <tr>
                  <td align="center" style="background-color: #f9fafb; border: 1px dashed #d1d5db; border-radius: 8px; padding: 16px;">
                    <span style="font-size: 28px; font-weight: 700; letter-spacing: 6px; color: #1f2937;">{{verificationCode}}</span>
                  </td>
                </tr>
              </table>
              <p style="margin: 0 0 24px 0; color: #6b7280; font-size: 14px; line-height: 1.5; text-align: center;">
                Se não foi você que solicitou, ignore este e-mail.
              </p>
              <p style="margin: 24px 0 0 0; color: #9ca3af; font-size: 13px; line-height: 1.5; text-align: center; border-top: 1px solid #f3f4f6; padding-top: 20px;">
                Este é um e-mail automático da Creatio. Por favor, não responda.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
